upstream hub_admin_prod {
    server 127.0.0.1:12228;
    keepalive 16;
}

upstream hub_admin_backend_prod {
    server 127.0.0.1:12001;
    keepalive 16;
}

server {
    listen 80;
    server_name admin.hub-net.org;

    allow 10.100.0.0/24;
    deny all;

    return 301 https://admin.hub-net.org$request_uri;
}

server {
    listen 80;
    server_name 10.100.0.1;

    allow 10.100.0.0/24;
    deny all;

    location ^~ /api/ {
        proxy_pass http://hub_admin_backend_prod;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://hub_admin_prod;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/admin-ip.access.log;
    error_log /var/log/nginx/admin-ip.error.log;
}

server {
    listen 443 ssl http2;
    server_name admin.hub-net.org;

    ssl_certificate /etc/letsencrypt/live/admin.hub-net.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.hub-net.org/privkey.pem;

    allow 10.100.0.0/24;
    deny all;

    location ^~ /api/ {
        proxy_pass http://hub_admin_backend_prod;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://hub_admin_prod;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/admin.hub-net.org.access.log;
    error_log /var/log/nginx/admin.hub-net.org.error.log;
}
