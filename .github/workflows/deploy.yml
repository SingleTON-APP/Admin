name: Deploy Admin

on:
  workflow_run:
    workflows: [Admin CI]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'develop')) ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'development' }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SSH_HOST: ${{ secrets[format('{0}_SSH_HOST', (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'PROD' || 'DEV')] }}
      SSH_PORT: ${{ secrets[format('{0}_SSH_PORT', (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'PROD' || 'DEV')] }}
      SSH_USER: ${{ secrets[format('{0}_SSH_USERNAME', (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'PROD' || 'DEV')] }}
      SSHPASS: ${{ secrets[format('{0}_SSH_PASSWORD', (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'PROD' || 'DEV')] }}
      SSH_KNOWN_HOSTS: ${{ secrets[format('{0}_SSH_KNOWN_HOSTS', (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'PROD' || 'DEV')] }}
      ADMIN_HOST_PORT: ${{ vars.ADMIN_HOST_PORT || ((github.event.workflow_run.head_branch || github.ref_name) == 'main' && '12228' || '') }}
      BACKEND_UPSTREAM: ${{ vars.ADMIN_BACKEND_UPSTREAM || ((github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'hub-backend-prod:5555' || 'hub-backend-dev:5555') }}
      SITE_BACKEND_UPSTREAM: ${{ vars.ADMIN_SITE_BACKEND_UPSTREAM || ((github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'hub-website-prod:3001' || 'hub-website-dev:3001') }}
      SITE_PUBLIC_URL: ${{ vars.SITE_PUBLIC_URL || 'https://hub-net.org' }}
      ADMIN_NETWORK: ${{ vars.ADMIN_DOCKER_NETWORK || ((github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'hub-prod-net' || 'hub-dev-net') }}
      DEPLOY_TIER: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'prod' || 'dev' }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      IMAGE_REPOSITORY: deployhubnetwork/admin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSHPASS SSH_KNOWN_HOSTS ADMIN_HOST_PORT BACKEND_UPSTREAM SITE_BACKEND_UPSTREAM SITE_PUBLIC_URL ADMIN_NETWORK DOCKER_HUB_USERNAME DOCKER_HUB_PASSWORD IMAGE_REPOSITORY; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name; configure Admin environment before deployment"; exit 1; fi
          done
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ && "$ADMIN_HOST_PORT" =~ ^[0-9]{1,5}$ ]]
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 && ADMIN_HOST_PORT >= 1024 && ADMIN_HOST_PORT <= 65535 ))
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ && "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$ADMIN_NETWORK" =~ ^[a-zA-Z0-9_.-]+$ ]]
          [[ "$BACKEND_UPSTREAM" =~ ^[a-zA-Z0-9.-]+:[0-9]{1,5}$ ]]
          [[ "$SITE_BACKEND_UPSTREAM" =~ ^[a-zA-Z0-9.-]+:[0-9]{1,5}$ ]]
          [[ "$SITE_PUBLIC_URL" =~ ^https?://[a-zA-Z0-9.-]+(:[0-9]{1,5})?(/.*)?$ ]]
          [[ "$DOCKER_HUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$IMAGE_REPOSITORY" =~ ^[a-z0-9][a-z0-9_.-]*/[a-z0-9][a-z0-9_.-]*$ ]]
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: '24'
          cache: npm
      - name: Validate manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Build and publish the verified frontend image
        run: |
          image="$IMAGE_REPOSITORY:$DEPLOY_TIER-$DEPLOY_SHA"
          docker build --label "org.opencontainers.image.revision=$DEPLOY_SHA" --build-arg VITE_API_URL=/api --build-arg VITE_SITE_API_URL=/site-api --build-arg VITE_SITE_MEDIA_URL=/site-api --build-arg VITE_SITE_PUBLIC_URL="$SITE_PUBLIC_URL" -t "$image" .
          docker push "$image"
      - name: Prepare verified SSH connection
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Transfer isolated Admin release
        shell: bash
        run: |
          set -euo pipefail
          target="/home/deploy/$DEPLOY_TIER/Hub/Admin"
          image="$IMAGE_REPOSITORY:$DEPLOY_TIER-$DEPLOY_SHA"
          ssh_options=(-o StrictHostKeyChecking=yes -o ConnectTimeout=180 -o ServerAliveInterval=20 -o ServerAliveCountMax=9)
          retry_safe_transfer() {
            local attempt=1
            until "$@"; do
              if (( attempt >= 3 )); then return 1; fi
              echo "Safe SSH transfer failed; retrying ($attempt/3)"
              attempt=$((attempt + 1))
              sleep 5
            done
          }
          remote_docker_login() {
            printf '%s\n' "$DOCKER_HUB_PASSWORD" | sshpass -e ssh "${ssh_options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "docker login --username '$DOCKER_HUB_USERNAME' --password-stdin"
          }
          printf 'ADMIN_IMAGE=%s\nADMIN_HOST_PORT=%s\nBACKEND_UPSTREAM=%s\nSITE_BACKEND_UPSTREAM=%s\nADMIN_NETWORK=%s\n' "$image" "$ADMIN_HOST_PORT" "$BACKEND_UPSTREAM" "$SITE_BACKEND_UPSTREAM" "$ADMIN_NETWORK" > admin-release.env
          retry_safe_transfer sshpass -e ssh "${ssh_options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$target/releases/$DEPLOY_SHA'"
          retry_safe_transfer sshpass -e scp "${ssh_options[@]}" -P "$SSH_PORT" admin-release.env docker-compose.yml scripts/deploy-admin.sh "$SSH_USER@$SSH_HOST:$target/releases/$DEPLOY_SHA/"
          retry_safe_transfer remote_docker_login
          retry_safe_transfer sshpass -e ssh "${ssh_options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash '$target/releases/$DEPLOY_SHA/deploy-admin.sh' '$target' '$DEPLOY_SHA' 'singleton-admin-$DEPLOY_TIER'"
      - name: Remove transfer files
        if: always()
        run: rm -f admin-release.env
