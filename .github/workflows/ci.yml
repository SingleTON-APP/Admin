name: Admin CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, hub]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: /api
      - name: Build container and check SPA routes
        run: |
          set -eu
          docker build --build-arg VITE_API_URL=/api -t singleton-admin:ci .
          docker run --detach --name admin-ci --env BACKEND_ORIGIN=http://127.0.0.1:1 --publish 127.0.0.1:18080:8080 singleton-admin:ci
          trap 'docker logs admin-ci; docker rm --force admin-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/healthz
          for route in /admin /admin/reports/report-ci /admin/security; do
            curl --fail --silent "http://127.0.0.1:18080$route" | cmp - dist/index.html
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/assets/missing.js)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/admin/auth/session)" = 502
          curl --fail --silent --head http://127.0.0.1:18080/admin | grep --ignore-case 'cache-control: no-store'
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: dist
          retention-days: 7
